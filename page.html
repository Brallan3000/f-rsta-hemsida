<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKEA inspirerad sida</title>
    <style>
        header {
            height: 90px;
            background-color:rgb(167, 147, 48);
            padding: 0 48px;
            display: flex;
            align-items: center;
            gap: 40px;
            justify-content: space-between;
        }
        .bananabread {
            display: flex;
            align-items: center;
            gap: 40px;
        }
        .logoImage {
            height: 40px;
        }
        .inputWrapper {
            display: flex;
            align-items: center;
            position: relative;
        }
        .searchIcon {
            position: absolute;
            left: 16px;
        }
        .wandIcon {
            position: absolute;
            right: 16px;
        }
        input {
            width: 400px;
            height: 48px;
            background-color: aqua;
            padding: 0 56px;
            border-radius: 64px;
            border: none;
            font-family: "Comic Sans MS";
        }
        input::placeholder {
            color: blue;
            }
        .icons {
            display: flex;
            gap: 24px;
        }
        nav {
            padding: 20px 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid brown;
        }
        .linkWithIcon {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .linkItem {
            text-decoration: none;
            color: darkmagenta;
            font-family: "Comic Sans MS";
        }
        a:hover {
            font-size: 18px;
            color: coral;
        }
    
    </style>
</head>

                <img class="logoImage" src="images/fake.jpg"/>

            </div>
        </header>

            <a href="#" class="linkItem">Du lyssnar inte!</a>
            <a href="#" class="linkItem">Finns inga möbler</a>

    </div>
</body>
